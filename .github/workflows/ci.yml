name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pir-api .
      - name: Start container and check /health
        run: |
          docker run -d -p 8000:8000 --name api pir-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
